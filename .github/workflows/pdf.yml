name: pdf

on:
  push:
    branches: [main]
    paths: ['**.tex', 'refs.bib', 'docs/**', '.github/workflows/pdf.yml']
  pull_request:
    paths: ['**.tex', 'refs.bib', 'docs/**', '.github/workflows/pdf.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wtfjoke/setup-tectonic@v3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ hashFiles('**/*.tex', 'refs.bib') }}
          restore-keys: tectonic-
      - run: tectonic paper3.tex
      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: paper3.pdf
      - name: Stage site
        if: github.event_name != 'pull_request'
        run: |
          mkdir _site
          cp paper3.pdf _site/
          cp -r docs _site/tricks
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>how2rite</title>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400&display=swap">
          <link rel="stylesheet" href="tricks/style.css"></head><body>
          <center><h2>Follow Your Strengths</h2>
          <h3>writing papers with LLMs</h3></center>
          <p class="card"><b><a href="tricks/">The eight tricks</a></b> &mdash;
          the method as separate moves you can combine as you want; each a two-minute read.</p>
          <p class="card"><b><a href="paper3.pdf">The paper (PDF)</a></b> &mdash;
          the full academic write-up.</p>
          <p class="card"><b><a href="https://github.com/timm/how2rite">The repo</a></b> &mdash;
          source, figures, and the rite engine.</p>
          </body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
